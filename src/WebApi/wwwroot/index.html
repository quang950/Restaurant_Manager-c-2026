<!DOCTYPE html>
<html lang="vi">

  <title>Quản Lý Nhà Hàng — Web Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>

<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">

  <!-- Modal Container -->
  <div id="modal-root" class="fixed inset-0 z-40 hidden items-center justify-center bg-slate-900/50 p-4"></div>

  <script type="module" src="/js/app.js"></script>
